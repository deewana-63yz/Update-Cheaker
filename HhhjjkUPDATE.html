
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
}
</style>
</head>
<body>
<script>
(async function () {
  try {
    const configUrl = new URL("https/jjkupdayecheaker);
    configUrl.searchParams.set("v", Date.now());

    const response = await fetch(configUrl, {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("Config unavailable");

    const data = await response.json();
    const apkUrl = new URL(data.apkUrl);

    if (apkUrl.protocol !== "https:") {
      throw new Error("Invalid download link");
    }

    window.location.replace(apkUrl.href);

  } catch (error) {
    document.body.textContent = "hhhjjjk.";
  }
})();
</script>
</body>
</html>
